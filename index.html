<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- Two entries, so the browser chrome matches the page before any script runs. The
         app narrows this to the active theme once it knows the user's explicit choice. -->
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Ledger+ — partnership accounting, powered by Trackmarg" />
    <title>Ledger+</title>
    <!-- Blocking on purpose: must set data-theme before the first paint. See the file. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
